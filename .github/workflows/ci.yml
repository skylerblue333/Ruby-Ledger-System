name: ruby-ledger-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Syntax
        run: |
          ruby -c lib/sky_ledger.rb
          ruby -c lib/sky_ledger/integration.rb
          ruby -c bin/sky-ledger
          ruby -c test/test_ledger.rb
          ruby -c test/test_integration.rb
      - name: Tests
        run: |
          ruby -Ilib:test test/test_ledger.rb
          ruby -Ilib:test test/test_integration.rb
      - name: CLI smoke
        run: |
          printf '%s' '{"id":"smoke-1","currency":"USD","occurred_at":"2026-08-24T12:00:00Z","entries":[{"account":"cash","amount_minor":100},{"account":"revenue","amount_minor":-100}]}' | ruby bin/sky-ledger | grep '"cash"'
      - name: Build image
        run: docker build -t sky-ruby-ledger:ci .
      - name: Verify non-root image
        run: test "$(docker run --rm --entrypoint id sky-ruby-ledger:ci -u)" != "0"
      - name: Container smoke
        run: |
          printf '%s' '{"id":"container-1","currency":"USD","occurred_at":"2026-08-24T12:00:00Z","entries":[{"account":"cash","amount_minor":100},{"account":"revenue","amount_minor":-100}]}' | docker run --rm -i sky-ruby-ledger:ci | grep '"container-1"'
